<text x='310' y='354' font-size='11' text-anchor='middle' fill='#555'>agents + job queue</text>
<rect x='440' y='225' width='320' height='64' rx='8' fill='#eef7ee' stroke='#3f8f4f' stroke-width='1.4'/>
<text x='600' y='254' font-size='14' font-weight='600' text-anchor='middle' fill='#222'>Tool domains</text>
<text x='600' y='271' font-size='11' text-anchor='middle' fill='#555'>inventree, freescout, outline, plane, n8n, web ...</text>

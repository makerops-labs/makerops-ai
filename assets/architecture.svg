<text x='600' y='350' font-size='14' font-weight='600' text-anchor='middle' fill='#222'>Write policy</text>
<text x='600' y='367' font-size='11' text-anchor='middle' fill='#555'>read: run | additive: run + notify | delete/effect: hold</text>
<rect x='440' y='420' width='320' height='70' rx='8' fill='#fde8e4' stroke='#c0392b' stroke-width='2.5'/>
<text x='600' y='452' font-size='14' font-weight='600' text-anchor='middle' fill='#222'>/approvals  (human gate)</text>
<text x='600' y='469' font-size='11' text-anchor='middle' fill='#555'>PENDING APPROVAL #id: approve or reject</text>
<rect x='440' y='515' width='320' height='36' rx='8' fill='#f3f3f3' stroke='#777777' stroke-width='1.4'/>
<text x='600' y='538' font-size='14' font-weight='600' text-anchor='middle' fill='#222'>Audit log + approval expiry</text>
<rect x='870' y='225' width='260' height='52' rx='8' fill='#fff8e6' stroke='#b38600' stroke-width='1.4'/>
<text x='1000' y='248' font-size='14' font-weight='600' text-anchor='middle' fill='#222'>InvenTree</text>
<text x='1000' y='265' font-size='11' text-anchor='middle' fill='#555'>parts, stock, BOMs, purchase orders</text>
<rect x='870' y='290' width='260' height='52' rx='8' fill='#fff8e6' stroke='#b38600' stroke-width='1.4'/>
<text x='1000' y='313' font-size='14' font-weight='600' text-anchor='middle' fill='#222'>FreeScout</text>
<text x='1000' y='330' font-size='11' text-anchor='middle' fill='#555'>customer email, draft replies</text>
<rect x='870' y='355' width='260' height='52' rx='8' fill='#fff8e6' stroke='#b38600' stroke-width='1.4'/>
<text x='1000' y='378' font-size='14' font-weight='600' text-anchor='middle' fill='#222'>Outline / Plane</text>
<text x='1000' y='395' font-size='11' text-anchor='middle' fill='#555'>docs, projects</text>
<rect x='870' y='420' width='260' height='52' rx='8' fill='#fff8e6' stroke='#b38600' stroke-width='1.4'/>
<text x='1000' y='443' font-size='14' font-weight='600' text-anchor='middle' fill='#222'>n8n / trigger.dev</text>
<text x='1000' y='460' font-size='11' text-anchor='middle' fill='#555'>workflows, scheduled jobs</text>
<rect x='870' y='485' width='260' height='52' rx='8' fill='#fff8e6' stroke='#b38600' stroke-width='1.4'/>
<text x='1000' y='508' font-size='14' font-weight='600' text-anchor='middle' fill='#222'>ComfyUI</text>
<text x='1000' y='525' font-size='11' text-anchor='middle' fill='#555'>image generation</text>
<rect x='565' y='70' width='150' height='60' rx='8' fill='#f3f3f3' stroke='#777777' stroke-width='1.4'/>
<text x='640' y='97' font-size='14' font-weight='600' text-anchor='middle' fill='#222'>SearXNG :8098</text>
<text x='640' y='114' font-size='11' text-anchor='middle' fill='#555'>private web search</text>
<rect x='735' y='70' width='170' height='60' rx='8' fill='#f3f3f3' stroke='#777777' stroke-width='1.4'/>
<text x='820' y='97' font-size='14' font-weight='600' text-anchor='middle' fill='#222'>sandbox</text>
<text x='820' y='114' font-size='11' text-anchor='middle' fill='#555'>ephemeral command runner</text>
<rect x='230' y='610' width='160' height='70' rx='8' fill='#f3f3f3' stroke='#777777' stroke-width='1.4'/>
<text x='310' y='642' font-size='14' font-weight='600' text-anchor='middle' fill='#222'>Ollama :11434</text>
<text x='310' y='659' font-size='11' text-anchor='middle' fill='#555'>local models for both UIs</text>
<rect x='870' y='610' width='280' height='70' rx='8' fill='#eef7ee' stroke='#3f8f4f' stroke-width='1.4'/>
<text x='1010' y='634' font-size='14' font-weight='600' text-anchor='middle' fill='#222'>redeploy</text>
<text x='1010' y='651' font-size='11' text-anchor='middle' fill='#555'>write file, restart, health check,</text>
<text x='1010' y='666' font-size='11' text-anchor='middle' fill='#555'>revert on failure</text>
<text x='30' y='712' font-size='11.5' fill='#666'>Red: the human approval point. Deletes, business effects (placing a PO, sending email) and code changes wait here; additive writes run and notify.</text>
<text x='30' y='730' font-size='11.5' fill='#666'>Exception: the n8nmcp passthrough (n8n workflow authoring via the n8n-mcp service) skips the write policy by design; its destructive tools are disabled instead.</text>
</svg>

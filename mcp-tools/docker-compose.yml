# mcp-tools — Shared MCP tool server for LLMs (Open WebUI + smolagents)
# Project name: mcp-tools  (managed by start.sh / stop.sh)
#
# Exposes:
#   8099/tcp — streamable-HTTP MCP at /mcp (all domains) and /mcp/<domain>,
#              plus the human write-approvals UI at /approvals and /healthz.
#
# Gives LLM clients web search (via ai/searxng), URL fetching, and tools for
# Outline, InvenTree, Plane, n8n, ComfyUI, FreeScout, draw.io, trigger.dev,
# smolagents agent scaffolding/dispatch, and multi-persona debates. Domains
# without an API token in .env are skipped at startup.

services:
  mcp-tools:
    build:
      context: .
      # Host networking during build: on WSL2 the host resolver
      # (10.255.255.254) is unreachable from bridge networks, which breaks
      # package downloads in build containers.
      network: host
    container_name: mcp-tools
    # Same WSL2 quirk at runtime — explicit resolvers so web_search/fetch_url
    # can resolve hostnames.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file: .env
    environment:
      # Containers default to UTC; current_time (and every timestamp shown
      # to agents) should report the user's wall clock (America/Chicago).
      TZ: "${TZ:-America/Chicago}"
    volumes:
      - ${MCPTOOLS_DATA_PATH:-./data/mcp-tools}:/data
      # agent_create scaffolds new smolagents agents into the repo working
      # tree (git-visible). Writes are restricted to agents/custom/ in code.
      - ../smolagents/agents:/smolagents-agents
      # Shared agent-job queue: agent_dispatch writes queued records here;
      # the smolagents job worker picks them up and owns all other status
      # transitions. Also feeds the /inbox page.
      - ${SMOLAGENTS_JOBS_PATH:-../smolagents/data/smolagents/jobs}:/agent-jobs
      # Shared debate session store: debate_start writes session.json + the
      # first turn's queued job record here; the smolagents job worker owns
      # turn advancement (writes round files, manifest entries, and queues
      # each following turn) — same split as the job queue above.
      - ${SMOLAGENTS_DEBATES_PATH:-../smolagents/data/smolagents/debates}:/agent-debates
      # Shared Alexa-liaison session store: liaison_turn (called by the
      # alexa-bridge service) appends the user's utterance and writes that
      # turn's queued job record here; the smolagents job worker owns
      # appending the liaison's own answer and the pending job/action
      # pointers once the turn runs — same split as the job/debate queues
      # above. One JSON file per Alexa userId.
      - ${SMOLAGENTS_LIAISON_PATH:-../smolagents/data/smolagents/liaison}:/agent-liaison
      # Shared devteam engagement store: devteam_start writes session.json +
      # the requirements phase's queued job record here, and the five
      # user-driven transitions (answer/approve/revise/resume/cancel) queue
      # follow-on phase jobs; the smolagents job worker owns every other
      # transition, including auto-advancing past ungated phases — same
      # split as the job/debate/liaison queues above.
      - ${SMOLAGENTS_DEVTEAM_PATH:-../smolagents/data/smolagents/devteam}:/agent-devteam
      # Shared hardware engagement store: hardware_start writes session.json
      # + the requirements phase's queued job record here, and the five
      # user-driven transitions (answer/approve/revise/resume/cancel) queue
      # follow-on phase jobs; the smolagents job worker owns every other
      # transition, including auto-advancing past ungated phases — same
      # split as the job/debate/liaison/devteam queues above.
      - ${SMOLAGENTS_HARDWARE_PATH:-../smolagents/data/smolagents/hardware}:/agent-hardware
      # Self-improvement loop: propose_code_change reads/diffs any file in
      # the repo (gating on human approval is the safety boundary, not a
      # path allowlist — see docs/ai-setup-checklist.md). The actual write
      # + restart happens in the separate redeploy service, which owns
      # Docker socket access; mcp-tools only computes and stores the diff.
      - ${MAKEROPS_AI_ROOT:-..}:/repo
      # Durable per-project directories (see WORKSPACES_ROOT in .env) — rw,
      # for the project domain only (read anywhere under it; writes confined
      # to a specific registered project). Deliberately NOT mounted into
      # smolagents (see smolagents/README.md "Executor safety").
      - ${WORKSPACES_ROOT:?set WORKSPACES_ROOT to your absolute ~/workspace path}:/workspaces
      # Code is bind-mounted so edits only need a container restart;
      # rebuild the image only when dependencies change.
      - ./server.py:/app/server.py:ro
      - ./tools:/app/tools:ro
      - ./workflows:/app/workflows:ro
    ports:
      - "${MCPTOOLS_PORT_HOST:-8099}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

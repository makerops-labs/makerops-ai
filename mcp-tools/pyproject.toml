[project]
name = "makerops-mcp-tools"
version = "0.1.0"
description = "Shared MCP tool server for MakerOps LLMs — web search, service APIs, write approvals"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "markitdown[pdf,docx,xlsx,pptx]>=0.1",
    "pillow>=10",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[dependency-groups]
# Test-only; the Docker image installs with `uv sync --no-dev`, so none of
# this reaches the runtime container.
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# openwebui — Chat UI for local LLMs via Ollama
# Project name: openwebui  (managed by start.sh / stop.sh)
#
# Exposes:
#   8080/tcp — Open WebUI web interface
#
# Connects to Ollama at http://host.docker.internal:11434 by default.
# Start ai/ollama before this service.
#
# UI: http://localhost:8080

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    # WSL2 quirk: the host resolver (10.255.255.254) is unreachable from
    # bridge networks — explicit resolvers so web search can fetch result pages.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file: .env
    environment:
      # Containers default to UTC, which made {{CURRENT_DATETIME}} in preset
      # system prompts report tomorrow's date every evening (host is
      # America/Chicago).
      TZ: "${TZ:-America/Chicago}"
    volumes:
      - ${OPENWEBUI_DATA_PATH:-./data/openwebui}:/app/backend/data
    ports:
      - "${OPENWEBUI_PORT_HOST:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
